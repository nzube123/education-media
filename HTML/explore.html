<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - SocialHub</title>
    <link rel="stylesheet" href="/collective.folder.css/styles.css">
    <link rel="stylesheet" href="/collective.folder.css/explore.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">SocialHub</a></div>
            <div class="nav-search">
                <input type="text" id="main-search" placeholder="Search posts, people, hashtags...">
            </div>
            <div class="nav-icons">
                <a href="index.html" class="nav-icon">🏠 Home</a>
                <a href="explore.html" class="nav-icon active">🔍 Explore</a>
                <a href="notifications.html" class="nav-icon">🔔 Notifications</a>
                <a href="messages.html" class="nav-icon">💬 Messages</a>
                <a href="profile.html" class="nav-icon">👤 Profile</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <div class="explore-filters">
                <h3>Categories</h3>
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="tech">🔧 Technology</button>
                <button class="category-btn" data-category="design">🎨 Design</button>
                <button class="category-btn" data-category="business">💼 Business</button>
                <button class="category-btn" data-category="lifestyle">🌟 Lifestyle</button>
                <button class="category-btn" data-category="gaming">🎮 Gaming</button>
            </div>
        </aside>

        <!-- Feed Section -->
        <main class="feed">
            <div class="explore-header">
                <h1>Explore</h1>
                <div class="sort-options">
                    <button class="sort-btn active" data-sort="trending">Trending</button>
                    <button class="sort-btn" data-sort="latest">Latest</button>
                    <button class="sort-btn" data-sort="popular">Popular</button>
                </div>
            </div>

            <div id="explore-feed" class="feed-container">
                <!-- Posts will be loaded here -->
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="right-sidebar">
            <div class="trending">
                <h3>Trending Worldwide</h3>
                <div class="trend-item">
                    <span class="trend-tag">#JavaScript</span>
                    <span class="trend-count">1.2M posts</span>
                </div>
                <div class="trend-item">
                    <span class="trend-tag">#WebDevelopment</span>
                    <span class="trend-count">856K posts</span>
                </div>
                <div class="trend-item">
                    <span class="trend-tag">#React</span>
                    <span class="trend-count">692K posts</span>
                </div>
                <div class="trend-item">
                    <span class="trend-tag">#FrontendDeveloper</span>
                    <span class="trend-count">543K posts</span>
                </div>
                <div class="trend-item">
                    <span class="trend-tag">#100DaysOfCode</span>
                    <span class="trend-count">421K posts</span>
                </div>
            </div>
        </aside>
    </div>

    <script src="/collective.folder.js/data.js"></script>
    <script src="/collective.folder.js/explore.js"></script>
</body>
</html>
