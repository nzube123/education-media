<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Education Media</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-content">
                <h1>Education Media</h1>
                <p>Your Learning Platform</p>
                <ul class="features">
                    <li>📚 Learn Anytime, Anywhere</li>
                    <li>👥 Connect with Others</li>
                    <li>🎯 Achieve Your Goals</li>
                </ul>
            </div>
        </div>

        <div class="login-right">
            <div class="login-form-container">
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to your account</p>

                <form class="login-form" action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <div class="remember-forgot">
                        <label class="remember-check">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-button">Sign In</button>
                </form>

                <p class="signup-prompt">
                    Don't have an account? <a href="index.html">Create one</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2>Login Confirmation</h2>
            </div>
            <div class="modal-body">
                <div id="modalMessage"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmLogin()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // Get form elements
        const loginForm = document.querySelector('.login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.querySelector('.login-button');
        const loginModal = document.getElementById('loginModal');
        const modalMessage = document.getElementById('modalMessage');

        // Email validation regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Store login credentials for confirmation
        let loginData = {
            email: '',
            password: ''
        };

        // Add event listener to form submission
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get input values
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validate email
            if (!email) {
                showError(emailInput, 'Email is required');
                return;
            }
            
            if (!emailRegex.test(email)) {
                showError(emailInput, 'Please enter a valid email address');
                return;
            } else {
                clearError(emailInput);
            }
            
            // Validate password
            if (!password) {
                showError(passwordInput, 'Password is required');
                return;
            }
            
            if (password.length < 6) {
                showError(passwordInput, 'Password must be at least 6 characters');
                return;
            } else {
                clearError(passwordInput);
            }
            
            // Store credentials and show popup
            loginData.email = email;
            loginData.password = password;
            showLoginPopup(email);
        });

        // Show login popup
        function showLoginPopup(email) {
            modalMessage.innerHTML = `
                <p>You are about to sign in with:</p>
                <p class="modal-email"><strong>Email:</strong> ${email}</p>
                <p class="modal-note">Please confirm to continue</p>
            `;
            openModal();
        }

        // Open modal
        function openModal() {
            loginModal.style.display = 'flex';
        }

        // Close modal
        function closeModal() {
            loginModal.style.display = 'none';
        }

        // Confirm login
        function confirmLogin() {
            loginButton.textContent = 'Signing in...';
            loginButton.disabled = true;

            // Simulate API call
            setTimeout(() => {
                // Success message
                modalMessage.innerHTML = `
                    <div class="modal-success">
                        <span class="success-icon">✓</span>
                        <p>Login successful!</p>
                        <p class="small-text">Redirecting to dashboard...</p>
                    </div>
                `;
                
                // Hide footer buttons
                document.querySelector('.modal-footer').style.display = 'none';
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }, 1500);
        }

        // Function to show error message
        function showError(inputElement, errorMessage) {
            inputElement.classList.add('input-error');
            const errorDiv = inputElement.parentElement.querySelector('.error-message');
            
            if (errorDiv) {
                errorDiv.textContent = errorMessage;
            } else {
                const newError = document.createElement('span');
                newError.className = 'error-message';
                newError.textContent = errorMessage;
                inputElement.parentElement.appendChild(newError);
            }
        }

        // Function to clear error message
        function clearError(inputElement) {
            inputElement.classList.remove('input-error');
            const errorDiv = inputElement.parentElement.querySelector('.error-message');
            if (errorDiv) {
                errorDiv.remove();
            }
        }

        // Clear errors on input focus
        emailInput.addEventListener('focus', function() {
            clearError(this);
        });

        passwordInput.addEventListener('focus', function() {
            clearError(this);
        });

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === loginModal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
