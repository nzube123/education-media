<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
  <h1>Education-Media sign-up.</h1>
  <p>Sign-up to access exclusive educational content.</p>
    <div id="error-message" style="color: red; display: none; margin-bottom: 20px;"></div>
    <div id="success-message" style="color: green; display: none; margin-bottom: 20px;"></div>
  
    <form id="signup-form" class="signup-container">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="signup-button">Sign Up</button>
  </form>
  <button class="back-button"><a href="index.html" >Back</a>
  </button>
  <p>If you already have an account, tap here to
    <a href="index.html">Log-in.</a>
  </p>
  
    <script>
      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
      
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
      
        const errorDiv = document.getElementById('error-message');
        const successDiv = document.getElementById('success-message');
      
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
      
        try {
          const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username, email, password })
          });
        
          const data = await response.json();
          if (response.ok && data.success) {
            successDiv.textContent = data.message;
            successDiv.style.display = 'block';
            document.getElementById('signup-form').reset();
            setTimeout(() => {
              window.location.href = data.redirect || '/index.html';
            }, 2000);
          } else {
            errorDiv.textContent = data.error || 'Signup failed';
            errorDiv.style.display = 'block';
          }
        } catch (error) {
          errorDiv.textContent = 'An error occurred during signup';
          errorDiv.style.display = 'block';
        }
      });
    </script>
  
</body>
</html>
