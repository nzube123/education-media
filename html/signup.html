<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
  <h1>Education-Media sign-up.</h1>
  <p>Sign-up to access exclusive educational content.</p>
  <form action="/signup" method="post" class="signup-container">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="signup-button">Sign Up</button>
  </form>
  <button class="back-button"><a href="index.html" >Back</a>
  </button>
  <p>If you already have an account, tap here to
    <a href="index.html">Log-in.</a>
  </p>
  
</body>
</html>
