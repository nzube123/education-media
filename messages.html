<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SocialHub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="messages.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html">SocialHub</a></div>
            <div class="nav-search">
                <input type="text" placeholder="Search...">
            </div>
            <div class="nav-icons">
                <a href="index.html" class="nav-icon">🏠 Home</a>
                <a href="notifications.html" class="nav-icon">🔔 Notifications</a>
                <a href="messages.html" class="nav-icon active">💬 Messages</a>
                <a href="profile.html" class="nav-icon">👤 Profile</a>
            </div>
        </div>
    </nav>

    <!-- Messages Container -->
    <div class="messages-wrapper">
        <!-- Conversations List -->
        <aside class="conversations-sidebar">
            <div class="messages-header">
                <h1>Messages</h1>
                <button class="new-message-btn">✏️ New</button>
            </div>
            
            <div class="conversations-search">
                <input type="text" id="conversation-search" placeholder="Search conversations...">
            </div>

            <div id="conversations-list" class="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div id="chat-empty" class="chat-empty">
                <div class="empty-icon">💬</div>
                <h2>Select a conversation</h2>
                <p>Choose someone to start messaging</p>
            </div>

            <div id="chat-container" class="chat-container" style="display: none;">
                <div class="chat-header">
                    <div class="chat-user-info">
                        <div class="chat-avatar">👤</div>
                        <div>
                            <h2 id="chat-user-name">User Name</h2>
                            <p id="chat-user-status">Active now</p>
                        </div>
                    </div>
                    <button class="chat-options-btn">⋮</button>
                </div>

                <div id="messages-display" class="messages-display">
                    <!-- Chat messages will be loaded here -->
                </div>

                <div class="message-input-area">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-btn" class="send-btn">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="messages.js"></script>
</body>
</html>
